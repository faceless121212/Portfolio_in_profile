<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illia Ladyha — Product Manager, Tel Aviv</title>
<meta name="description" content="Illia Ladyha — product manager in Tel Aviv. Obsessed with hourly progress, building meaningful products.">
<meta property="og:title" content="Illia Ladyha">
<meta property="og:description" content="Obsessed with hourly progress · building meaningful products">
<meta property="og:image" content="assets/photo.jpg">
<link rel="icon" href="assets/mascot.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root {
    --bg: #EEF6FF;
    --bg-2: #DDEEFF;
    --card: #FFFFFF;
    --line: #DCE6F2;
    --ink: #1D2B44;
    --ink-2: #5B6B85;
    --ink-3: #9AA8BD;

    --sky: #2E9BFF;     --sky-d: #1B74D1;
    --sun: #FFC21A;     --sun-d: #E09A00;
    --coral: #FF5D4F;   --coral-d: #D23E31;
    --grape: #9A63FF;   --grape-d: #7340D6;
    --mint: #1FCB98;    --mint-d: #12A077;
    --flame: #FF8A1F;

    --radius: 20px;
    --press: 5px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A2E; --bg-2: #13223C; --card: #182840; --line: #24385A;
      --ink: #F2F6FF; --ink-2: #A9B8D3; --ink-3: #6E809F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1A2E; --bg-2: #13223C; --card: #182840; --line: #24385A;
    --ink: #F2F6FF; --ink-2: #A9B8D3; --ink-3: #6E809F;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", ui-rounded, system-ui, sans-serif;
    font-weight: 700;
    color: var(--ink);
    background: var(--bg);
    min-height: 100dvh;
    overflow-x: hidden;
  }
  img { display: block; user-select: none; -webkit-user-drag: none; }
  button { font: inherit; color: inherit; }

  /* drifting background clouds */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%); }
  .puff { position: absolute; background: var(--card); opacity: .7; border-radius: 999px; filter: drop-shadow(0 6px 0 var(--line)); animation: drift linear infinite; }
  .puff::before, .puff::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .puff::before { width: 55%; height: 160%; left: 15%; bottom: 20%; }
  .puff::after  { width: 40%; height: 120%; right: 14%; bottom: 25%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  .wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 16px 16px 40px; }

  /* HUD */
  .hud { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 8px; }
  .theme { width: 44px; height: 44px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px;
    background: var(--card); cursor: pointer; font-size: 20px; display: grid; place-items: center; }
  .theme:active { transform: translateY(2px); border-bottom-width: 2px; }

  /* mascot + speech */
  .intro { display: flex; align-items: flex-end; gap: 6px; margin: 6px 0 -26px; position: relative; z-index: 3; }
  .mascot { width: 96px; height: 96px; flex: none; cursor: pointer; animation: bob 3s ease-in-out infinite; transform-origin: 50% 100%; }
  .mascot.jump { animation: jump .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes jump { 0% { transform: scale(1,1) } 30% { transform: translateY(-26px) scale(.92,1.1) } 60% { transform: translateY(0) scale(1.1,.9) } 100% { transform: scale(1) } }
  .bubble { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px;
    font-size: 15px; line-height: 1.3; margin-bottom: 40px; min-height: 48px; }
  .bubble::before { content: ""; position: absolute; left: -10px; bottom: 14px; width: 16px; height: 16px; background: var(--card);
    border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); border-radius: 0 0 0 4px; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--ink-3); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  /* profile card */
  .profile { background: var(--card); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 28px;
    padding: 40px 20px 22px; text-align: center; position: relative; z-index: 2; }
  .avatar { width: 136px; height: 136px; margin: 0 auto 12px; position: relative; cursor: pointer; border: 0; padding: 0; background: none; display: block; }
  .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    border: 5px solid var(--sky); box-shadow: 0 5px 0 var(--sky-d); background: var(--sky); transition: border-color .2s, box-shadow .2s; }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.flipped .face { border-color: var(--sun); box-shadow: 0 5px 0 var(--sun-d); }
  .level { position: absolute; right: -6px; bottom: 2px; z-index: 2; background: var(--sun); color: #5A3A00; font-weight: 900; font-size: 13px;
    padding: 4px 9px; border-radius: 12px; border: 3px solid var(--card); box-shadow: 0 3px 0 var(--sun-d); letter-spacing: .02em; }
  .flip-hint { position: absolute; left: -4px; bottom: 6px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: var(--card);
    border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; }

  h1 { font-weight: 900; font-size: 32px; line-height: 1.05; margin: 4px 0 6px; letter-spacing: -.01em; }
  .meta { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 16px; }
  .meta img { width: 22px; height: 22px; }
  .tagline { margin: 14px auto 0; font-size: 16px; color: var(--ink-2); max-width: 300px; line-height: 1.4; }
  .tagline b { color: var(--ink); font-weight: 900; }

  /* xp bar */
  .xp { margin-top: 18px; text-align: left; }
  .xp-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .xp-top span:last-child { color: var(--sun-d); }
  .bar { height: 18px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; border-radius: 999px; background: var(--sun); position: relative; transition: width 1.4s cubic-bezier(.2,.9,.3,1); }
  .fill::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.55); }

  /* section label */
  .label { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 26px 4px 10px; }

  /* chunky link buttons */
  .links { display: grid; gap: 14px; }
  .btn { --c: var(--sky); --d: var(--sky-d); display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff;
    background: var(--c); border-radius: var(--radius); padding: 12px 16px 12px 12px; box-shadow: 0 var(--press) 0 var(--d);
    transition: transform .08s, box-shadow .08s, filter .15s; position: relative; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(var(--press)); box-shadow: 0 0 0 var(--d); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn .ico { width: 58px; height: 58px; flex: none; border-radius: 16px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
  .btn .ico img { width: 44px; height: 44px; transition: transform .25s cubic-bezier(.3,1.8,.5,1); }
  .btn:hover .ico img { transform: rotate(-8deg) scale(1.12); }
  .btn .txt { flex: 1; min-width: 0; }
  .btn .t { font-weight: 900; font-size: 19px; line-height: 1.1; }
  .btn .s { font-weight: 700; font-size: 14px; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn .go { width: 36px; height: 36px; flex: none; border-radius: 12px; background: rgba(255,255,255,.25); display: grid; place-items: center; font-weight: 900; font-size: 20px; }
  .btn.letter { --c: var(--grape); --d: var(--grape-d); }

  /* badges */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { background: var(--card); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 18px; padding: 12px 6px 10px;
    text-align: center; cursor: pointer; transition: transform .08s; }
  .badge:active { transform: translateY(3px); border-bottom-width: 2px; margin-top: 3px; }
  .badge img { width: 52px; height: 52px; margin: 0 auto 6px; transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
  .badge.pop img { transform: scale(1.25) rotate(8deg); }
  .badge b { display: block; font-weight: 900; font-size: 14px; line-height: 1.15; }
  .badge small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.2; }

  footer { text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 800; margin-top: 30px; letter-spacing: .06em; text-transform: uppercase; }
  footer img { width: 36px; height: 36px; margin: 0 auto 6px; opacity: .9; }

  /* confetti */
  .confetti { position: fixed; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 50; }

  /* entrance */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .5s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 360px) {
    h1 { font-size: 28px; }
    .badges { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="puff" style="top:9%;width:120px;height:34px;animation-duration:70s;animation-delay:-20s"></div>
  <div class="puff" style="top:34%;width:170px;height:44px;animation-duration:95s;animation-delay:-60s"></div>
  <div class="puff" style="top:62%;width:90px;height:26px;animation-duration:60s;animation-delay:-5s"></div>
  <div class="puff" style="top:84%;width:150px;height:40px;animation-duration:85s;animation-delay:-40s"></div>
</div>

<main class="wrap">
  <div class="hud rise" style="animation-delay:.0s">
    <button class="theme" id="theme" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div class="intro rise" style="animation-delay:.08s">
    <img class="mascot" id="mascot" src="assets/mascot.webp" alt="Cloud mascot">
    <div class="bubble" aria-live="polite"><span id="say"></span><span class="caret"></span></div>
  </div>

  <section class="profile rise" style="animation-delay:.16s">
    <button class="avatar" id="avatar" aria-label="Flip avatar">
      <div class="face"><img id="face" src="assets/photo.jpg" alt="Illia Ladyha"></div>
      <link rel="preload" as="image" href="assets/avatar_toon.jpg">
      <span class="flip-hint" aria-hidden="true">🔄</span>
      <span class="level">LVL 13</span>
    </button>
    <h1>Illia Ladyha</h1>
    <div class="meta"><img src="assets/pin.webp" alt="">Product Manager · Tel Aviv</div>
    <p class="tagline">Obsessed with <b>hourly progress</b> · building <b>meaningful products</b></p>

    <div class="xp">
      <div class="xp-top"><span>Next level</span><span id="xpLabel">0 / 1000 XP</span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
  </section>

  <div class="label rise" style="animation-delay:.24s">Find me</div>
  <nav class="links">
    <a class="btn rise" style="animation-delay:.3s" href="https://linkedin.com/in/illia-ladyha" target="_blank" rel="noopener" data-say="linkedin">
      <span class="ico"><img src="assets/briefcase.webp" alt=""></span>
      <span class="txt"><div class="t">LinkedIn</div><div class="s">linkedin.com/in/illia-ladyha</div></span>
      <span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
    <a class="btn letter rise" style="animation-delay:.36s" href="https://substack.com/@illialadyha" target="_blank" rel="noopener" data-say="substack">
      <span class="ico"><img src="assets/letter.webp" alt=""></span>
      <span class="txt"><div class="t">Substack</div><div class="s">substack.com/@illialadyha</div></span>
      <span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>
  </nav>

  <div class="label rise" style="animation-delay:.42s">Badges</div>
  <div class="badges">
    <button class="badge rise" style="animation-delay:.46s" data-say="b1"><img src="assets/rocket.webp" alt=""><b>Ship it</b><small>every hour</small></button>
    <button class="badge rise" style="animation-delay:.5s" data-say="b2"><img src="assets/target.webp" alt=""><b>Outcomes</b><small>over output</small></button>
    <button class="badge rise" style="animation-delay:.54s" data-say="b3"><img src="assets/trophy.webp" alt=""><b>13 iterations</b><small>and counting</small></button>
    <button class="badge rise" style="animation-delay:.58s" data-say="b4"><img src="assets/chat.webp" alt=""><b>Talk users</b><small>weekly ritual</small></button>
    <button class="badge rise" style="animation-delay:.62s" data-say="b5"><img src="assets/crown.webp" alt=""><b>Meaning</b><small>over busy</small></button>
    <button class="badge rise" style="animation-delay:.66s" data-say="b6"><img src="assets/star.webp" alt=""><b>Curious</b><small>always learning</small></button>
  </div>

  <footer class="rise" style="animation-delay:.7s">
    <img src="assets/mascot.webp" alt="">
    © <span id="yr">2026</span> — Illia Ladyha
  </footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const lines = {
    hello: "Hey! I'm Cumulo ☁️ Illia's sidekick. Tap anything to earn XP!",
    linkedin: "Career stuff, roadmaps and the occasional hot take 💼",
    substack: "Long-form notes on building products that matter 💌",
    avatar: "Same Illia, extra cartoon. Tap again to flip back!",
    mascot: ["Wheee! ☁️", "Hey, that tickles!", "I'm 100% water vapour.", "Boing!"],
    b1: "Tiny releases, every hour. Momentum beats perfection 🚀",
    b2: "Ship to move a metric, not to tick a box 🎯",
    b3: "Thirteen versions in, still polishing 🏆",
    b4: "Every week starts with a real user conversation 💬",
    b5: "Meaningful work > busy work 👑",
    b6: "Always learning, always asking why ⭐",
    level: "LEVEL UP! 🎉 You're officially a power-clicker."
  };

  // typewriter bubble
  const say = $("say"); let typing;
  function talk(text) {
    clearInterval(typing); say.textContent = ""; let i = 0;
    const chars = [...text];
    typing = setInterval(() => { say.textContent += chars[i++] ?? ""; if (i >= chars.length) clearInterval(typing); }, 22);
  }

  // XP / levels
  let xp = 0, level = 13; const NEXT = 1000;
  function addXP(n, x, y) {
    xp += n;
    if (xp >= NEXT) { xp -= NEXT; level++; document.querySelector(".level").textContent = "LVL " + level; talk(lines.level); burst(innerWidth / 2, innerHeight / 3, 60); }
    $("xpLabel").textContent = xp + " / " + NEXT + " XP";
    $("fill").style.width = Math.max(4, xp / NEXT * 100) + "%";
    if (x != null) burst(x, y, 14);
  }

  // confetti
  const colors = ["#2E9BFF", "#FFC21A", "#FF5D4F", "#9A63FF", "#1FCB98", "#FF8A1F"];
  function burst(x, y, n) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("div"); el.className = "confetti";
      el.style.background = colors[i % colors.length]; el.style.left = x + "px"; el.style.top = y + "px";
      document.body.appendChild(el);
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      el.animate([
        { transform: "translate(0,0) rotate(0)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * v}px, ${Math.sin(a) * v + 120}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 800 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => el.remove();
    }
  }

  $("yr").textContent = new Date().getFullYear();

  // interactions
  document.querySelectorAll("[data-say]").forEach(el => el.addEventListener("click", (e) => {
    talk(lines[el.dataset.say]);
    addXP(el.classList.contains("btn") ? 50 : 20, e.clientX, e.clientY);
    if (el.classList.contains("badge")) { el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 350); }
  }));
  $("avatar").addEventListener("click", (e) => {
    const f = $("avatar").classList.toggle("flipped"), face = $("face"), box = face.parentElement;
    box.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: 160, easing: "ease-in" }).onfinish = () => {
      face.src = f ? "assets/avatar_toon.jpg" : "assets/photo.jpg"; face.alt = f ? "Cartoon Illia" : "Illia Ladyha";
      box.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1.08)" }, { transform: "scaleX(1)" }], { duration: 320, easing: "ease-out" });
    };
    talk(f ? lines.avatar : "And we're back to the real deal 📸"); addXP(30, e.clientX, e.clientY);
  });
  $("mascot").addEventListener("click", (e) => {
    const m = $("mascot"); m.classList.remove("jump"); void m.offsetWidth; m.classList.add("jump");
    talk(lines.mascot[Math.floor(Math.random() * lines.mascot.length)]); addXP(10, e.clientX, e.clientY);
  });
  $("mascot").addEventListener("animationend", () => $("mascot").classList.remove("jump"));

  // theme toggle
  const root = document.documentElement, tbtn = $("theme");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
  const sync = () => tbtn.textContent = isDark() ? "☀️" : "🌙";
  tbtn.addEventListener("click", () => { root.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("theme", root.dataset.theme); } catch {} sync(); });
  sync();

  setTimeout(() => talk(lines.hello), 500);
  setTimeout(() => $("fill").style.width = "4%", 600);
})();
</script>
</body>
</html>
